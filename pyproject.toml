[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "murakami"
version = "0.1.0"
description = "A webthings-compliant network measurement tool from M-Lab."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Josh King", email = "josh@throneless.tech" },
    { name = "Rae Gaines", email = "rae@throneless.tech" },
]
requires-python = ">=3.11"
dependencies = [
    "webthing>=0.12.0",
    "configargparse>=0.14.0",
    "tomlkit>=0.5.5",
    "apscheduler>=3.6",
    "paramiko>=2.6",
    "scp>=0.13.2",
    "jsonlines>=1.2",
    "livejson>=1.8",
    "google-cloud-storage>=1.26.0",
    "protobuf>=7.34.0",
    "setuptools>=82.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[project.scripts]
murakami = "murakami.__main__:main"
murakami-convert = "scripts.convert:main"
murakami-upload = "scripts.upload:main"

[project.urls]
Homepage = "https://github.com/m-lab/murakami"
Repository = "https://github.com/m-lab/murakami"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "SIM",
    "TCH",
    "S",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "S603",
    "S607",
    "B904",
    "N818",
    "UP022",
    "UP031",
    "SIM102",
    "SIM117",
    "SIM118",
    "SIM108",
    "S113",
    "S507",
    "C405",
    "S311",
    "S101",
]

[tool.ruff.lint.isort]
known-first-party = ["murakami"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.hatch.build.targets.wheel]
packages = ["murakami"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.4",
]
